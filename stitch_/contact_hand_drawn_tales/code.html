<body class="bg-surface text-on-surface font-body-md overflow-x-hidden">
<div class="fixed inset-0 grain-overlay z-[60]"></div>
<!-- Navigation -->
<nav class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md shadow-sm">
<div class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-4 max-w-container-max mx-auto">
<div class="text-headline-md font-headline-md font-semibold text-primary">Studio Magic</div>
<div class="hidden md:flex gap-gutter items-center">
<a class="text-label-md font-label-md text-on-surface-variant hover:text-primary transition-colors duration-300" href="#">Home</a>
<a class="text-label-md font-label-md text-on-surface-variant hover:text-primary transition-colors duration-300" href="#">Works</a>
<a class="text-label-md font-label-md text-on-surface-variant hover:text-primary transition-colors duration-300" href="#">Aesthetic</a>
<a class="text-label-md font-label-md text-primary border-b-2 border-primary-container pb-1 transition-colors duration-300" href="#">Contact</a>
</div>
<div class="flex items-center gap-4">

</button>
</div>
</div>

<main class="relative min-h-screen pt-24 pb-12 flex flex-col items-center">
<!-- Hero Illustration Area -->
<section class="w-full max-w-container-max px-margin-mobile md:px-margin-desktop mb-12">
<div class="relative h-[300px] md:h-[450px] w-full rounded-xl overflow-hidden shadow-sm parchment-border">
<img alt="Rustic Mailbox" class="w-full h-full object-cover" data-alt="A charming, hand-painted watercolor illustration of a weathered wooden mailbox standing beside a narrow dirt path. The background features a soft, out-of-focus rustic cottage nestled among lush greenery and wildflowers under a warm golden hour sun. The lighting is diffused and ethereal, creating a nostalgic and peaceful atmosphere consistent with the Studio Ghibli aesthetic. The color palette is dominated by earthy browns, soft greens, and warm creams, evoking a sense of quiet joy and slow living." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA2eXrIIbdEpZmkQBXij6hRHljrDZvv4O1Z3Pk4_Uxbbkj0bOJ1FNPJufulUkdBcpv6aNUfdy-niUxg0fp9Z8zUN6M-88OvYNd7ERLkA0s6O0PTnBdJFl3touOMu66h0anJ7TVeq-eRPZyIDlMHAbXQidq0M_p6MTkU4F9hWwQX36BxtiHEp0WNv9PwoduxpnROwyvQNrMX3aBKw01l22RIcOoXm18kW2ZYTZdQA2_vLeHTVky6Y9em27EZ20cuvMc-Z53CaBtHM31D"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface/60 to-transparent"></div>
</div>
</section>
<!-- Centered Contact Form Section (Ma Focus) -->
<section class="w-full max-w-[600px] px-margin-mobile mx-auto flex flex-col items-center text-center">
<header class="mb-12">
<h1 class="text-headline-lg font-headline-lg text-on-surface mb-2">Send a Letter</h1>
<p class="text-body-md font-body-md text-on-surface-variant">We value slow stories and quiet conversations. Let your thoughts wander onto the page.</p>
</header>
<form class="w-full space-y-gutter bg-surface-container-lowest/40 p-8 md:p-12 rounded-xl parchment-border shadow-sm">
<div class="flex flex-col text-left gap-2">
<label class="text-label-sm font-label-sm text-outline px-2" for="name">Name</label>
<input class="w-full bg-surface-container-low border-outline-variant rounded-lg p-4 text-body-md font-body-md focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all shadow-inner placeholder:text-outline-variant/60" id="name" placeholder="How shall we call you?" type="text"/>
</div>
<div class="flex flex-col text-left gap-2">
<label class="text-label-sm font-label-sm text-outline px-2" for="email">Email Address</label>
<input class="w-full bg-surface-container-low border-outline-variant rounded-lg p-4 text-body-md font-body-md focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all shadow-inner placeholder:text-outline-variant/60" id="email" placeholder="Where should our reply fly?" type="email"/>
</div>
<div class="flex flex-col text-left gap-2">
<label class="text-label-sm font-label-sm text-outline px-2" for="message">Your Story</label>
<textarea class="w-full bg-surface-container-low border-outline-variant rounded-lg p-4 text-body-md font-body-md focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all shadow-inner placeholder:text-outline-variant/60 resize-none" id="message" placeholder="Share your thoughts..." rows="5"></textarea>
</div>
<div class="pt-4">
<button class="bg-error text-on-error px-12 py-4 rounded-full font-label-md text-label-md soft-glow-error active:scale-95 transition-all flex items-center justify-center gap-2 mx-auto" type="submit">
<span class="material-symbols-outlined" data-icon="mail">mail</span>
                        Send Letter
                    </button>
</div>
</form>
<div class="mt-12 flex flex-col items-center gap-4 text-on-surface-variant opacity-60">
<span class="material-symbols-outlined text-headline-md" data-icon="spa">spa</span>
<p class="text-label-sm font-label-sm">Breathe. We will reply when the sun sets.</p>
</div>
</section>
</main>
<!-- Footer -->
<footer class="w-full rounded-t-xl bg-surface-container-low mt-24">
<div class="flex flex-col md:flex-row justify-between items-center gap-gutter px-margin-mobile md:px-margin-desktop py-12 max-w-container-max mx-auto">

<div class="text-headline-sm font-headline-sm text-primary">Studio Magic</div>
<p class="text-body-md font-body-md text-on-surface-variant">© 2024 Hand-Drawn Tales. Crafted with Ma.</p>
</div>
<div class="flex gap-gutter">

</div>
<div class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined text-[20px]" data-icon="potted_plant">potted_plant</span>
</div>
</div>
</div>
</footer>
